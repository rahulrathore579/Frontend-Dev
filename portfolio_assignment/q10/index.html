<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Complete Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="#">Home</a><a href="#">About</a><a href="#">Services</a><a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1>Welcome to Our Site</h1>
      <p>Centered welcome text over a hero image.</p>
    </div>
  </section>

  <section class="about">
    <div class="col text">
      <h2>About Us</h2>
      <p>Some text about the company. Uses margin, padding and borders demonstration.</p>
    </div>
    <div class="col image">
      <!-- simple svg placeholder -->
      <svg width="320" height="220" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#e6eef8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">About Image</text></svg>
    </div>
  </section>

  <section class="services">
    <div class="service">Service A</div>
    <div class="service">Service B</div>
    <div class="service">Service C</div>
  </section>

  <section id="contact" class="contact">
    <form>
      <label>Name <input type="text"></label>
      <label>Email <input type="email"></label>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer class="site-footer">© 2025 Company</footer>
</body>
</html>
