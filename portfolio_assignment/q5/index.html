<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing Plans</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pricing">
    <h1>Pricing</h1>
    <div class="plans">
      <div class="plan">
        <h2>Basic</h2>
        <ul><li>Feature A</li><li>Feature B</li></ul>
        <div class="price">₹499</div>
        <a class="btn" href="#">Choose</a>
      </div>

      <div class="plan popular">
        <h2>Standard</h2>
        <ul><li>Feature A</li><li>Feature B</li><li>Feature C</li></ul>
        <div class="price">₹999</div>
        <a class="btn" href="#">Choose</a>
      </div>

      <div class="plan">
        <h2>Premium</h2>
        <ul><li>Feature A</li><li>Feature B</li><li>Feature C</li><li>Feature D</li></ul>
        <div class="price">₹1999</div>
        <a class="btn" href="#">Choose</a>
      </div>
    </div>
  </main>
</body>
</html>
