<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colored Table</title>
  <style>
    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    table {
      border-collapse: collapse;
      width: auto;
      height: auto;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    th, td {
      border: 2px solid #ddd;
      padding: 12px 20px;
    }

    th {
      background-color: #4a90e2;
      color: white;
      font-weight: bold;
    }

    tr:hover {
      background-color: #d6eaff;
      transition: 0.3s;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>Column 1</th>
      <th>Column 2</th>
      <th>Column 3</th>
      <th>Column 4</th>
      <th>Column 5</th>
    </tr>
    <tr>
      <td style="color: #4a90e2;">Row</td>
      <td>Data</td>
      <td>Data</td>
      <td>Data</td>
      <td>Data</td>
    </tr>
    <tr>
      <td style="color: #4a90e2;">Row</td>
      <td>Data</td>
      <td>Data</td>
      <td>Data</td>
      <td>Data</td>
    </tr>
    <tr>
      <td style="color: #4a90e2;">Row</td>
      <td>Data</td>
      <td>Data</td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td style="color: #4a90e2;">Row</td>
      <td>Data</td>
      <td>Data</td>
      <td></td>
      <td></td>
    </tr>
  </table>

</body>
</html>
